name: Publish @aihu/context

on:
  push:
    tags: ['context-v*']

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /tmp/aihu-context-npmrc-oidc-only
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Bind release to reviewed default branch
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "context-v$version"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$RELEASE_SHA"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
      - name: Verify reviewed merged release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-reviewed-release.mjs
      - name: Prepare OIDC-only npm config
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm run test:release-contract
      - run: node scripts/check-oidc-auth.mjs
      - run: node scripts/assert-unpublished.mjs
      - name: Pack one exact allowlisted tarball
        id: pack
        env:
          PACK_DIR: ${{ runner.temp }}/aihu-context-pack
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DIR"
          node scripts/verify-pack.mjs
          tgz="$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tgz"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - name: Verify exact tarball in an isolated consumer
        run: node scripts/consumer-smoke.mjs "${{ steps.pack.outputs.tgz }}"
      - name: Publish exact verified tarball with provenance
        run: npm publish "${{ steps.pack.outputs.tgz }}" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
