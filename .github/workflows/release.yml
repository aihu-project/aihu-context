name: Publish context

on:
  push:
    tags:
      - 'context-v*'

permissions:
  contents: read

env:
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  verify:
    name: Verify release manifest
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: bun install --frozen-lockfile
      - run: bun run check:release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: bun run check:ci

  publish:
    name: Publish @aihu/context
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: bun install --frozen-lockfile
      - name: Publish exact version if needed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for publishing"
            exit 1
          fi
          npm whoami --registry "$NPM_REGISTRY" >/dev/null
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          set +e
          lookup="$(npm view "$package@$version" version --registry "$NPM_REGISTRY" 2>&1)"
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            echo "$package@$version already exists; keeping the release idempotent"
          elif printf '%s\n' "$lookup" | grep -Eq '(^|[^[:alnum:]])E404([^[:alnum:]]|$)'; then
            npm publish . --access public --provenance --registry "$NPM_REGISTRY"
          else
            echo "::error::npm view failed without a confirmed 404; refusing to publish"
            printf '%s\n' "$lookup"
            exit "$lookup_status"
          fi
